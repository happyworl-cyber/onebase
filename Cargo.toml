[package]
name = "onebase"
version = "0.1.0"
edition = "2021"
default-run = "onebase"

[dependencies]
# Web 框架
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.35", features = ["full"] }
# axum 0.7 transitively pulls tower 0.5; match it so `ServiceExt::oneshot` resolves
# cleanly in unit tests (the previous 0.4 direct dep was unused).
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "catch-panic", "timeout", "set-header"] }
futures = "0.3"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "mysql", "json", "time", "chrono", "macros", "uuid", "rust_decimal"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 环境变量
dotenv = "0.15"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 文件日志（按天滚动 + 非阻塞写入）。可选：仅当 LOG_DIR / LOG_FILE 环境变量被
# 设置时才会真正写文件；不设置时保持纯 stdout，对本地开发零成本。
tracing-appender = "0.2"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 认证和安全
jsonwebtoken = "9.2"
bcrypt = "0.15"
once_cell = "1.19"

# 验证
validator = { version = "0.18", features = ["derive"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# 定时调度
cron = "0.12"

# 并发数据结构
dashmap = "5.5"

# Redis
# tokio-native-tls-comp：让 Redis 数据源支持 rediss://（TLS，tokio 异步）；与项目其余处
# （sqlx/reqwest）统一走 native-tls。
redis = { version = "0.25", features = ["tokio-comp", "connection-manager", "tokio-native-tls-comp"] }

# Kafka 数据源（工作流 produce + kafka 触发器）
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }

# 对象存储数据源（COS / OSS / MinIO，S3 兼容）
# 用轻量 rusty-s3（Sans-IO + 复用 reqwest），避免 aws-sdk-s3 → aws-lc-sys 拖垮冷编译。
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "full"] }

# HTTP 客户端（用于 OAuth2 回调）
reqwest = { version = "0.11", features = ["json", "native-tls", "stream", "blocking"], default-features = false }

# UUID（用于 OAuth state token）
uuid = { version = "1.0", features = ["v4", "serde"] }

# 加密
aes-gcm = "0.10"
base64 = "0.21"
hex = "0.4"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
rand = "0.8"
# 对称分组加密原语（AES-CBC/ECB）+ 旧系统常见摘要（MD5/SHA1），供 Lua crypto.* 复用。
# 与 aes-gcm 0.10 共用底层 aes 0.8 / cipher 0.4，不引入额外重量。
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
md-5 = "0.10"
sha1 = "0.10"

# Lua 插件引擎
mlua = { version = "0.11", features = ["lua54", "async", "send", "serialize", "vendored"] }

# Async trait（用于 RuntimeAdapter）
async-trait = "0.1"

# Pattern 匹配（ES 代理 token 的 index allowlist / path denylist 用）—— sqlx / tracing
# 已经间接依赖了 regex，这里只是把它升级成直接依赖，没有额外重量。
regex = "1"

# PostgREST 兼容的 raw query 解析里给 value 做 percent-decode（`%2C`→`,` 等），
# 让 `IN (a,b,c)` 列表能正确拆开。axum 已经传递依赖此包，升级成直接依赖即可。
percent-encoding = "2"
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport"] }
rsa = { version = "0.9.10", features = ["pem"] }

[[bin]]
name = "onebase"
path = "src/main.rs"

[[bin]]
name = "license_tool"
path = "src/bin/license_tool.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "migrate_examples"
path = "src/bin/migrate_examples.rs"

[[bin]]
name = "migrate_management"
path = "src/bin/migrate_management.rs"

[[bin]]
name = "migrate_api_keys"
path = "src/bin/migrate_api_keys.rs"

[[bin]]
name = "migrate_rbac"
path = "src/bin/migrate_rbac.rs"

[[bin]]
name = "migrate_sso"
path = "src/bin/migrate_sso.rs"

[[bin]]
name = "migrate_all"
path = "src/bin/migrate_all.rs"

[[bin]]
name = "migrate_passwords"
path = "src/bin/migrate_passwords.rs"

[[bin]]
name = "migrate_scheduled_tasks"
path = "src/bin/migrate_scheduled_tasks.rs"

[[bin]]
name = "migrate_workflow"
path = "src/bin/migrate_workflow.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

