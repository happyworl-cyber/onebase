[supervisord]
nodaemon=true
user=root
logfile=/var/log/onebase/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/onebase

; 子进程继承容器环境变量（DATABASE_URL、JWT_SECRET、ENCRYPTION_KEY 等由编排层注入）
;
; 日志：默认仅 stdout —— 转发到 supervisord 自己的 fd 1/2，docker logs /
; kubectl logs 直接可见；maxbytes=0 关闭 supervisord 自己的轮转（Docker json log
; driver 的 max-size / max-file 已经能兜底，再轮转一次纯属浪费 IO）。
;
; 需要文件落盘时（运维捞历史日志、对接 ELK 文件采集等）按需在 .env 或编排层
; 加上 `LOG_DIR=/var/log/onebase` 即可——Rust 进程内置的 tracing-appender 会
; 自动按天滚动写 `onebase.log.YYYY-MM-DD`，stdout 仍然同步输出。
[program:onebase-backend]
command=/app/bin/onebase
directory=/app
user=root
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=5
stopwaitsecs=35
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=RUST_LOG="info"

[program:onebase-frontend]
command=node server.js
directory=/app/frontend
user=root
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=5
stdout_logfile=/var/log/onebase/frontend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/var/log/onebase/frontend-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=HOSTNAME="0.0.0.0",PORT="3001",NODE_ENV="production"
