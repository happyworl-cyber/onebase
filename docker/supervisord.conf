[supervisord]
nodaemon=true
user=root
logfile=/var/log/onebase/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/onebase

[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /var/lib/postgresql/15/main
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/onebase/postgresql.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/onebase/postgresql-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
startsecs=5
stopwaitsecs=30

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --dir /var/lib/redis --appendonly yes
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/onebase/redis.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/onebase/redis-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
startsecs=2

[program:onebase-backend]
command=/app/bin/onebase
directory=/app
user=root
autostart=true
autorestart=true
priority=30
startsecs=3
startretries=5
stopwaitsecs=35
stopsignal=TERM
stdout_logfile=/var/log/onebase/backend.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/onebase/backend-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=
    DATABASE_URL="%(ENV_DATABASE_URL)s",
    REDIS_URL="%(ENV_REDIS_URL)s",
    JWT_SECRET="%(ENV_JWT_SECRET)s",
    HOST="%(ENV_HOST)s",
    PORT="%(ENV_PORT)s",
    CORS_ORIGINS="%(ENV_CORS_ORIGINS)s",
    RUST_ENV="%(ENV_RUST_ENV)s",
    REQUEST_TIMEOUT_SECS="%(ENV_REQUEST_TIMEOUT_SECS)s",
    GRACEFUL_SHUTDOWN_SECS="%(ENV_GRACEFUL_SHUTDOWN_SECS)s",
    CIRCUIT_BREAKER_FAILURE_THRESHOLD="%(ENV_CIRCUIT_BREAKER_FAILURE_THRESHOLD)s",
    CIRCUIT_BREAKER_TIMEOUT_SECS="%(ENV_CIRCUIT_BREAKER_TIMEOUT_SECS)s",
    RATE_LIMIT_PER_MINUTE="%(ENV_RATE_LIMIT_PER_MINUTE)s",
    AUTO_MIGRATE="%(ENV_AUTO_MIGRATE)s",
    RUST_LOG="info"

[program:onebase-frontend]
command=/app/frontend/node_modules/.bin/next start -p 3001
directory=/app/frontend
user=root
autostart=true
autorestart=true
priority=40
startsecs=3
startretries=5
stdout_logfile=/var/log/onebase/frontend.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/var/log/onebase/frontend-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=NEXT_PUBLIC_API_URL="%(ENV_NEXT_PUBLIC_API_URL)s",NODE_ENV="production"
